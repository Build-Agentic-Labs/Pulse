name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Keep CI on Node 24 / npm 11, matching the Linux lockfile regeneration job.
      # Platform-excluded optional deps (sharp/@emnapi) can otherwise yield
      # different lockfile trees across npm generations.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # next-env.d.ts is gitignored (generated by `next dev`/`next build`); recreate it
      # so `tsc --noEmit` sees the same ambient Next.js types it does locally.
      - name: Restore next-env.d.ts
        run: |
          printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > next-env.d.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # Compile-time public configuration only; CI never needs production credentials.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-only

      - name: Generated route typecheck
        run: npm run typecheck

      - name: Client bundle budget
        run: npm run check:bundles

  # The database is the enforcement layer for SOP document control, so the rules that matter most
  # live in triggers and RLS policies that `npm test` cannot reach. This job is why it is caught:
  # on 2026-07-25 the pgTAP suite found a number stamp that moved a document's content hash --
  # voiding the very signature that authorized the release -- while typecheck, lint, 530 vitest
  # tests, and two review passes were all green. Separate job so a database failure is legible on
  # sight rather than buried in the Node checks.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # v3 is a composite action (v1 was Node-based and ran on the deprecated Node 20).
      # It installs the CLI from npm rather than GitHub releases; the removed `github-token`
      # input was never used here, so `version` is the whole contract.
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: 2.119.0

      - name: Start Postgres
        run: supabase db start 2>&1 | tee database-start.log

      # `db start` brings up Postgres; the reset is what applies every migration from scratch and
      # then runs supabase/seed.sql -- which the suites now require, since it carries both the
      # table grants the hosted project gets from platform defaults and the shared
      # test_ready_for_approval helper.
      #
      # The reset is itself a real test: the SOP transition guard is patched in place via
      # pg_get_functiondef + guarded replace, so a migration whose anchor has drifted raises here
      # rather than silently reverting an earlier migration's work.
      - name: Apply migrations and seed
        run: supabase db reset --local 2>&1 | tee database-reset.log

      - name: pgTAP
        run: |
          set -o pipefail
          supabase test db --local supabase/tests tests/quality-work-instructions/database.sql 2>&1 | tee database-tests.log

      - name: Upload database test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: database-tests
          path: |
            database-start.log
            database-reset.log
            database-tests.log
          if-no-files-found: ignore
          retention-days: 7

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: AWI browser workflows against isolated local Supabase
        run: npm run test:browser 2>&1 | tee browser-tests.log
      - name: Upload browser report and failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-tests
          path: |
            browser-tests.log
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  quality-wi:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: WI browser workflows on a fresh isolated database
        run: node scripts/test-quality-wi-ci.mjs
      - name: Upload WI browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quality-wi-failures
          path: test-results/
          retention-days: 7
